name: Sync deploy dashboard

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar dashboard.svg
        run: node scripts/sync-deploys.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_SLUG: paulo-araujo
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

      - name: Commit se houver mudanças
        run: |
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add dashboard.svg
          git diff --cached --quiet || git commit -m "chore: sync deploy dashboard"
          git push
