<svg xmlns="http://www.w3.org/2000/svg" width="860" height="240" viewBox="0 0 860 240" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#04060d"/><stop offset=".55" stop-color="#0b1028"/><stop offset="1" stop-color="#150f33"/></linearGradient>
  <linearGradient id="ttl" x1="0" x2="1"><stop offset="0" stop-color="#00f5ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00f5ff" stop-opacity=".45"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#7aa2ff" stroke-opacity=".07"/></pattern>
  <filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .h{font-size:20px;font-weight:700;letter-spacing:2px}
    .t{font-size:15px;font-weight:700;letter-spacing:1.5px}
    .n{font-size:13px;fill:#dbe7ff}
    .k{font-size:11px;fill:#7d8fb8;letter-spacing:.5px}
  </style>
</defs>
<rect width="860" height="240" rx="18" fill="url(#bg)"/><rect width="860" height="240" rx="18" fill="url(#grid)"/>
<rect y="-2" width="860" height="3" fill="#00f5ff" fill-opacity=".22"><animate attributeName="y" values="0;240;0" dur="9s" repeatCount="indefinite"/></rect>

<circle cx="730" cy="120" r="5" fill="#00f5ff" filter="url(#glow)"/><circle cx="730" cy="120" r="36" fill="none" stroke="#a78bfa" stroke-opacity=".45" stroke-dasharray="4 10"><animateTransform attributeName="transform" type="rotate" from="0 730 120" to="360 730 120" dur="12s" repeatCount="indefinite"/></circle><circle cx="730" cy="120" r="66" fill="none" stroke="#a78bfa" stroke-opacity=".45" stroke-dasharray="2 14"><animateTransform attributeName="transform" type="rotate" from="0 730 120" to="-360 730 120" dur="22s" repeatCount="indefinite"/></circle><circle cx="730" cy="120" r="98" fill="none" stroke="#a78bfa" stroke-opacity=".45" stroke-dasharray="30 18"><animateTransform attributeName="transform" type="rotate" from="0 730 120" to="360 730 120" dur="32.666666666666664s" repeatCount="indefinite"/></circle>
<circle cx="52" cy="46" r="4" fill="#39ff88"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
<text x="66" y="50" class="k">STATUS · ONLINE · DISPONÍVEL PARA PROJETOS</text>
<text x="48" y="112" font-size="54" font-weight="800" letter-spacing="3" fill="url(#ttl)" filter="url(#glow)">PAULO ARAÚJO</text>
<text x="50" y="142" font-size="14" letter-spacing="5" fill="#a78bfa">DEVELOPER • BUILDING THE FUTURE</text>
<text x="48" y="190" font-size="18" fill="#00f5ff" opacity="0">› Construindo o futuro linha a linha<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.21;.25;1" dur="16s" begin="0s" repeatCount="indefinite"/></text><text x="48" y="190" font-size="18" fill="#00f5ff" opacity="0">› Desenvolvedor de software | Web &amp; Automação<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.21;.25;1" dur="16s" begin="4s" repeatCount="indefinite"/></text><text x="48" y="190" font-size="18" fill="#00f5ff" opacity="0">› Transformando ideias em produtos reais<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.21;.25;1" dur="16s" begin="8s" repeatCount="indefinite"/></text><text x="48" y="190" font-size="18" fill="#00f5ff" opacity="0">› Sempre aprendendo, sempre evoluindo<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.21;.25;1" dur="16s" begin="12s" repeatCount="indefinite"/></text>
</svg>