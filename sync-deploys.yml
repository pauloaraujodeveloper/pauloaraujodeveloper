name: Sync profile visuals

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar badges.svg, stack.svg e deploys.svg
        run: node scripts/generate-visuals.mjs
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

      - name: Commit se houver mudanças
        run: |
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add badges.svg stack.svg deploys.svg
          git diff --cached --quiet || git commit -m "chore: sync profile visuals"
          git push
