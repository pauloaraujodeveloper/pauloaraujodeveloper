<svg xmlns="http://www.w3.org/2000/svg" width="860" height="176" viewBox="0 0 860 176" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
